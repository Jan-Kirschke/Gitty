[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitty-messenger"
version = "5.0.0"
description = "TLS-encrypted terminal messenger with GitHub auth, chatrooms, saved friends, and admin controls"
readme = "README.md"
requires-python = ">=3.8"
keywords = ["terminal", "messenger", "chat", "tls", "github", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]

[project.scripts]
gitty = "gitty.secure:client_main"
gitty-server = "gitty.secure:server_main"
gitty-client = "gitty.secure:client_main"

[project.optional-dependencies]
release = ["build>=1.2", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/Jan-Kirschke/Gitty"
Repository = "https://github.com/Jan-Kirschke/Gitty"
Issues = "https://github.com/Jan-Kirschke/Gitty/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
