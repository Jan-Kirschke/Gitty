<svg xmlns="http://www.w3.org/2000/svg" width="640" height="475" viewBox="0 0 640 475">
  <style>
    .bg { fill: #1e1e1e; }
    text {
      font-family: 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace;
      font-size: 14px;
      white-space: pre;
    }
    .green { fill: #23d18b; }
    .cyan { fill: #29b8db; }
    .magenta { fill: #d670d6; }
    .blue { fill: #3b8eea; }
    .red { fill: #f14c4c; }
    .gray { fill: #d4d4d4; }
    .bold { font-weight: bold; }
  </style>
  <rect class="bg" width="100%" height="100%" rx="8" />
  <text x="20" y="30" xml:space="preserve" class="green">  _____ _ _   _</text>
  <text x="20" y="48" xml:space="preserve" class="green"> / ____(_) | | |</text>
  <text x="20" y="66" xml:space="preserve" class="green">| |  __ _| |_| |_ _   _</text>
  <text x="20" y="84" xml:space="preserve" class="green">| | |_ | | __| __| | | |</text>
  <text x="20" y="102" xml:space="preserve" class="green">| |__| | | |_| |_| |_| |</text>
  <text x="20" y="120" xml:space="preserve" class="green"> \_____|_|\__|\__|\__, |</text>
  <text x="20" y="138" xml:space="preserve" class="green">                  __/ |</text>
  <text x="20" y="156" xml:space="preserve" class="green">                 |___/</text>
  <text x="20" y="178" xml:space="preserve" class="cyan">  Secure Terminal Messenger v3.2</text>

  <text x="20" y="210" xml:space="preserve" class="green bold">Chat &amp; Rooms</text>
  <text x="20" y="230" xml:space="preserve"><tspan class="green">  /rooms                  </tspan><tspan class="gray">List active chatrooms</tspan></text>
  <text x="20" y="248" xml:space="preserve"><tspan class="green">  /create ROOM            </tspan><tspan class="gray">Create a new chatroom</tspan></text>
  <text x="20" y="266" xml:space="preserve"><tspan class="green">  /join ROOM              </tspan><tspan class="gray">Join a chatroom</tspan></text>
  <text x="20" y="284" xml:space="preserve"><tspan class="green">  /leave                  </tspan><tspan class="gray">Leave the current chatroom</tspan></text>
  <text x="20" y="302" xml:space="preserve"><tspan class="green">  /users                  </tspan><tspan class="gray">List users in the room</tspan></text>
  <text x="20" y="320" xml:space="preserve"><tspan class="green">  /msg USER TEXT          </tspan><tspan class="gray">Send a direct message</tspan></text>

  <text x="20" y="352" xml:space="preserve" class="magenta bold">Friends</text>
  <text x="20" y="372" xml:space="preserve"><tspan class="magenta">  /friends                </tspan><tspan class="gray">Show friends &amp; online status</tspan></text>
  <text x="20" y="390" xml:space="preserve"><tspan class="magenta">  /friend add USER        </tspan><tspan class="gray">Add a GitHub user</tspan></text>
  <text x="20" y="408" xml:space="preserve"><tspan class="magenta">  /friend remove USER     </tspan><tspan class="gray">Remove a friend</tspan></text>

  <text x="20" y="438" xml:space="preserve" class="blue bold">General</text>
  <text x="20" y="456" xml:space="preserve"><tspan class="blue">  /help                   </tspan><tspan class="gray">Show help</tspan></text>
  <text x="20" y="474" xml:space="preserve"><tspan class="red">  /exit                   </tspan><tspan class="gray">Disconnect and quit</tspan></text>
</svg>